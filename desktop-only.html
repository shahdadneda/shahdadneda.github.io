<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desktop only · Shahdad Neda</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23151412'/%3E%3Ctext x='8' y='12' font-size='11' text-anchor='middle' fill='%23e0a458' font-family='sans-serif' font-weight='700'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./fonts.css?v=3">
  <style>
    :root {
      --bg: #151412;
      --line: #2b2823;
      --text: #ece7de;
      --muted: #989186;
      --accent: #e0a458;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 500 16px/1.65 "Uber Move", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main { max-width: 380px; }
    h1 { font-size: 22px; font-weight: 700; margin: 0 0 10px; }
    p { margin: 0 0 22px; color: var(--muted); }
    a {
      color: var(--text);
      text-decoration: none;
      font-family: var(--mono);
      font-size: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 14px;
      display: inline-block;
    }
    a:hover { color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Desktop only</h1>
    <p id="msg">This game is a Unity build that needs a keyboard, so it can't run on a phone. Open it on a computer instead.</p>
    <a href="/">&larr; back to shahdad.ca</a>
  </main>
  <script>
    var game = new URLSearchParams(location.search).get('game');
    if (game) {
      document.getElementById('msg').textContent =
        game + " is a Unity build that needs a keyboard, so it can't run on a phone. Open it on a computer instead.";
      document.title = game + ' · desktop only';
    }
  </script>
</body>
</html>
