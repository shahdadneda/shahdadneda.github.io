<!DOCTYPE html>
<html>
<head>
    <title>Shahdaddy</title>
    <style>
        body {
            background-color: #b1d8ff;
            margin: 0;
            padding: 30px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #2c3e50;
            font-size: 36px;
            margin-bottom: 20px;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
        }
        
        .projects {
            margin: 25px 0;
        }
        
        .project-link {
            display: block;
            margin: 15px 0;
            padding: 15px;
            background-color: #f5f7fa;
            border-radius: 8px;
            text-decoration: none;
            color: #2980b9;
            font-weight: 600;
            transition: all 0.3s ease;
            border-left: 5px solid #3498db;
        }
        
        .project-link:hover {
            background-color: #e8f4fc;
            transform: translateX(5px);
        }
        

        
        footer {
            margin-top: 40px;
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
        }
        
        .footer-link {
            color: #3498db;
            text-decoration: none;
        }
        
        .footer-link:hover {
            text-decoration: underline;
        }
        
        .github-button, .x-button {
            position: absolute;
            right: 20px;
            padding: 10px;
            background-color: #f5f7fa;
            border-radius: 8px;
            text-decoration: none;
            color: #2980b9;
            transition: all 0.3s ease;
            border: 2px solid #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }
        
        .github-button { top: 20px; }
        .x-button { top: 70px; }
        
        .github-button:hover, .x-button:hover {
            background-color: #e8f4fc;
            transform: translateY(-2px);
        }
        
        .github-icon, .x-icon { width: 24px; height: 24px; }

        /* New layout */
        .section { margin: 36px 0; }
        .section-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 22px; color: #2c3e50; margin: 0 0 14px 0;
            border-bottom: 2px solid #e2eefb; padding-bottom: 8px;
        }
        .cards {
            display: grid; grid-template-columns: 1fr; gap: 12px;
        }
        @media (min-width: 720px) {
            .cards { grid-template-columns: 1fr 1fr; }
        }
        .card-link {
            display: flex; gap: 12px; align-items: center;
            padding: 16px; background: #f5f7fa; border-radius: 10px;
            text-decoration: none; color: #2c3e50; border: 1px solid #e6eef7;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform .15s ease, background .2s ease;
        }
        .card-link:hover { background: #ecf5ff; transform: translateY(-2px); }
        .card-emoji { font-size: 20px; }
        .card-title { font-weight: 700; color: #1e5fa1; }
        .card-sub { font-size: 13px; color: #5c728a; }
        .card-text { display: flex; flex-direction: column; }
    </style>
</head>
<body>
<div class="container">

        </svg>
    </a>
    <a href="https://x.com/shahdadneda" class="x-button" target="_blank">

        <div class="cards">

                <div class="card-text">
                    <span class="card-title">Tetris (Web)</span>
                    <span class="card-sub">Vanilla JS</span>
                </div>
            </a>
            <a href="./RocketRumble/sitebuild/index.html" class="card-link">
