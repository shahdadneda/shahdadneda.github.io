<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-Do List | Shahdad Neda</title>
    <meta
      name="description"
      content="A simple to-do list built with plain HTML, CSS, and JavaScript."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../fonts.css?v=1" />
    <link rel="stylesheet" href="./style.css?v=1" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <main class="page" id="main-content">
      <section class="hero-card">
        <a class="back-link" href="../index.html">Back to shahdad.ca</a>
        <p class="eyebrow">Vanilla HTML, CSS, and JavaScript</p>
        <h1>My To-Do List</h1>
        <p class="intro">
          Add a task, check it off when you finish it, and keep everything saved
          in your browser even after refreshing the page.
        </p>
      </section>

      <section class="todo-card" aria-labelledby="todo-heading">
        <div class="todo-header">
          <div>
            <h2 id="todo-heading">Tasks</h2>
            <p class="todo-subtitle">Small steps still count.</p>
          </div>
          <div class="task-count" id="task-count" aria-live="polite">0 tasks</div>
        </div>

        <form class="todo-form" id="todo-form">
          <label class="sr-only" for="task-input">Add a new task</label>
          <input
            id="task-input"
            name="task"
            type="text"
            placeholder="What do you want to get done?"
            maxlength="120"
            autocomplete="off"
            required
          />
          <button type="submit">Add Task</button>
        </form>

        <p class="form-message" id="form-message" aria-live="polite"></p>

        <ul class="task-list" id="task-list" aria-live="polite"></ul>

        <div class="empty-state" id="empty-state">
          <p>No tasks yet. Add your first one above.</p>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
