<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tetris · Shahdad Neda</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23151412'/%3E%3Ctext x='8' y='12' font-size='11' text-anchor='middle' fill='%23e0a458' font-family='sans-serif' font-weight='700'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../fonts.css?v=3">
  <link rel="stylesheet" href="./style.css?v=4">
</head>
<body>
  <div class="wrap">
    <header class="bar">
      <a class="back" href="../">&larr; shahdad.ca</a>
      <h1>Tetris</h1>
      <button class="ghost-btn" id="btn-pause" type="button">pause</button>
    </header>

    <div class="stats">
      <span>score <b id="score">0</b></span>
      <span>best <b id="high">0</b></span>
      <span>lines <b id="lines">0</b></span>
      <span class="next-wrap">next <canvas id="next" width="96" height="48"></canvas></span>
    </div>

    <div class="stage" id="stage">
      <canvas id="tetris"></canvas>
      <div class="overlay" id="overlay" hidden>
        <p class="overlay-title" id="overlay-title"></p>
        <p class="overlay-sub" id="overlay-sub"></p>
      </div>
    </div>

    <div class="under">
      <p class="hint hint-keys">&larr;&rarr; move &middot; &uarr; rotate &middot; space drops</p>
      <p class="hint hint-touch">drag to move &middot; tap rotates &middot; flick down drops</p>
      <button class="ghost-btn" id="btn-restart" type="button">restart</button>
    </div>
  </div>

  <script src="./game.js?v=4"></script>
</body>
</html>
